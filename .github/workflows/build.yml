
name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  # ====================================
  # ANALISIS DE LA APLICACION MOVIL
  # ====================================
  sonarqube-mobile:
    name: SonarQube - Aplicacion Movil
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NatyMoonApp/package-lock.json

      - name: Install mobile dependencies
        working-directory: NatyMoonApp
        run: npm ci

      - name: Authenticate with SonarQube
        uses: SonarSource/sonarqube-auth-action@v1
        id: auth

      - name: Analyze mobile application
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: NatyMoonApp
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}

  # ====================================
  # ANALISIS DE LA APLICACION WEB
  # ====================================
  sonarqube-web:
    name: SonarQube - Aplicacion Web
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: natymoo-frontend/package-lock.json

      - name: Install web dependencies
        working-directory: natymoo-frontend
        run: npm ci

      - name: Authenticate with SonarQube
        uses: SonarSource/sonarqube-auth-action@v1
        id: auth

      - name: Analyze web application
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: natymoo-frontend
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ vars.SONAR_WEB_PROJECT_KEY }}
